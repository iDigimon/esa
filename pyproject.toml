[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "certbot-dns-esa"
version = "0.1.0"
description = "阿里云边缘安全加速 ESA DNS 插件，用于 Certbot 的 DNS-01 验证"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "tiyee", email = "tiyee@live.com"}]
keywords = ["certbot", "dns-01", "acme", "aliyun", "esa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
]
dependencies = [
    "certbot>=3,<5; python_version < '3.10'",
    "certbot>=3,<6; python_version >= '3.10' and python_version < '3.14'",
    # josepy 1.x used by Certbot 3 cannot import on Python >=3.14 (PEP 649).
    "certbot>=4,<6; python_version >= '3.14'",
    "acme>=3,<6",
    "alibabacloud-esa20240910>=3.16,<4",
    "alibabacloud-tea-openapi>=0.4.5,<1",
    "darabonba-core>=1.0.8,<2",
    "importlib-metadata>=4.6,<9; python_version < '3.10'",
]

[project.urls]
Homepage = "https://github.com/tiyee/certbot-dns-esa"
Repository = "https://github.com/tiyee/certbot-dns-esa"
Issues = "https://github.com/tiyee/certbot-dns-esa/issues"

[project.entry-points."certbot.plugins"]
dns-esa = "certbot_dns_esa.dns_esa:Authenticator"

[dependency-groups]
dev = [
    # Keep the Python 3.9 dev host on Certbot 3; ACME 4 requires PyOpenSSL >=25.
    "certbot>=3,<4; python_version < '3.10'",
    "pyopenssl<25; python_version < '3.10'",
    "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1",
    "tox>=4.28,<5", "tox-uv>=1.26,<2", "twine>=6,<7",
    "tomli>=2,<3; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["certbot_dns_esa"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["/certbot_dns_esa", "/tests", "/scripts", "/examples", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/tox.ini", "/uv.lock"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os" = {msg = "Use from certbot.compat import os for cross-platform compatibility."}
